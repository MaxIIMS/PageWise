[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "local-rag"
version = "0.1.0"
description = "Fully local RAG assistant for books and documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3", "rich>=13.7.1", "pydantic>=2.7", "pydantic-settings>=2.2",
  "PyYAML>=6.0", "python-dotenv>=1.0", "langchain>=0.2.16",
  "langchain-community>=0.2.16", "langchain-text-splitters>=0.2.2",
  "chromadb>=0.5.5", "sentence-transformers>=3.0.1", "torch>=2.3.1",
  "pypdf>=4.3.1", "python-docx>=1.1.2", "ebooklib>=0.18",
  "beautifulsoup4>=4.12", "requests>=2.32"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
rag = "local_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/local_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
